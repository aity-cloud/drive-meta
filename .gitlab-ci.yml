# meta has no build; it mirrors itself to github.com/aity-cloud/drive-meta
# (ADR 0004) and runs the weekly Renovate sweep over the subgroup (M5,
# renovate/config.js; jobs, variables and schedules in docs/ci.md).
stages: [contract, mirror, renovate]

default:
  tags: [docker, shared]

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Tier 1 end-to-end: the server contract the Clients depend on. Runs on
# every push here, and hourly against staging via the schedule, so a
# server-side regression is found by a machine instead of by Raul on a
# phone (which is how the oCIS 8 LDAP break was found - see the script's
# header). Read-mostly: one file created and deleted in the test user's
# own space.
contract:staging:
  stage: contract
  image: registry.aity.tech/catalog/library/alpine:3.22
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  retry:
    max: 2
    when: [runner_system_failure, api_failure, unknown_failure]
  script:
    - apk add --no-cache python3 >/dev/null
    - |
      python3 contract/drive_contract.py \
        --base-url https://drive.aity.works \
        --issuer   https://auth.aity.works/realms/aity

# The same contract against PRODUCTION. Manual on purpose: it signs in as a
# real user and writes a file, so a human decides when. Needs its own
# credentials (AITY_CONTRACT_USER_PROD / _PASSWORD_PROD) - the staging user
# does not exist there.
contract:production:
  stage: contract
  image: registry.aity.tech/catalog/library/alpine:3.22
  when: manual
  allow_failure: true
  variables:
    AITY_CONTRACT_USER: $AITY_CONTRACT_USER_PROD
    AITY_CONTRACT_PASSWORD: $AITY_CONTRACT_PASSWORD_PROD
  script:
    - apk add --no-cache python3 >/dev/null
    - |
      if [ -z "$AITY_CONTRACT_USER" ]; then
        echo "No production contract account yet (AITY_CONTRACT_USER_PROD unset)."
        echo "Create one the same way as staging - meta/contract/README.md - then re-run."
        exit 1
      fi
      python3 contract/drive_contract.py \
        --base-url https://drive.aity.tech \
        --issuer   https://auth.aity.tech/realms/aity

include:
  - local: ci/mirror.yml

# Renovate CE over the whole subgroup. Runs on the weekly schedule that sets
# RENOVATE="true", or manually from the web UI; never on plain main pushes
# (those run only mirror:github). The scheduled pipeline re-runs
# mirror:github too - an idempotent re-push of refs GitHub already has,
# kept as a weekly self-heal of the mirror.
renovate:
  stage: renovate
  image: renovate/renovate:44
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RENOVATE == "true"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  variables:
    RENOVATE_CONFIG_FILE: renovate/config.js
    LOG_LEVEL: info
    # Default to the group-inherited GITLAB_TOKEN (api + write_repository,
    # the semantic-release token): gitlab.com Free cannot mint group access
    # tokens, so a dedicated bot token is not available. A RENOVATE_TOKEN
    # variable set on the subgroup takes precedence over this default.
    RENOVATE_TOKEN: "$GITLAB_TOKEN"
  script:
    - test -n "$RENOVATE_TOKEN" || { echo "RENOVATE_TOKEN is required (docs/ci.md)."; exit 1; }
    - renovate
