# meta has no build; it only mirrors itself to github.com/aity-cloud/drive-meta
# (ADR 0004). Renovate (M5) will be added here as a scheduled job.
stages: [mirror]

default:
  tags: [docker, shared]

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

include:
  - local: ci/mirror.yml
